<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyDay</title>
<style>
/* ================= 设计令牌 ================= */
:root{
  --bg:#f3f5f9; --bg2:#eaedf4; --card:#ffffff; --text:#191d27; --text2:#5a6172; --text3:#9299a8;
  --border:#e6e9f0; --accent:#4c6ef5; --accent2:#7c5cf5; --accent-weak:#eef1fe;
  --danger:#e03131; --warn:#f08c00; --ok:#2f9e44;
  --shadow:0 1px 2px rgba(23,29,49,.04),0 6px 20px rgba(23,29,49,.05);
  --shadow-lg:0 12px 32px rgba(23,29,49,.14);
  --tag-media:#e8590c; --tag-dev:#4263eb; --tag-consult:#0ca678; --tag-life:#9c36b5;
  --r:14px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#131418; --bg2:#1a1c22; --card:#1e2027; --text:#e9ebf1; --text2:#a9aebb; --text3:#767b88;
  --border:#2e313b; --accent:#748ffc; --accent2:#9775fa; --accent-weak:#2a3050;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.22);
  --shadow-lg:0 12px 32px rgba(0,0,0,.5);
  color-scheme:dark;
}
/* ================= 基础与布局 ================= */
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:
    radial-gradient(1100px 480px at 85% -10%, rgba(124,92,245,.07), transparent 60%),
    radial-gradient(900px 420px at -10% 0%, rgba(76,110,245,.08), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:3px solid transparent;background-clip:content-box}
#app{display:flex;min-height:100vh}
#sidebar{width:210px;flex:0 0 210px;background:var(--card);border-right:1px solid var(--border);
  padding:18px 12px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:16px;padding:0 4px}
.logo{width:36px;height:36px;border-radius:11px;flex:0 0 36px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(76,110,245,.35)}
.brand h1{font-size:17px;margin:0;letter-spacing:.3px}
.brand-date{color:var(--text2);font-size:12px;margin:1px 0 0}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 11px;border:0;background:none;
  color:var(--text2);border-radius:10px;cursor:pointer;font-size:14px;text-align:left;font-family:inherit;
  transition:background .15s,color .15s}
.nav-item:hover{background:var(--accent-weak);color:var(--text)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav-item svg{width:16px;height:16px;flex:0 0 16px}
#data-status{margin-top:auto;font-size:12px;color:var(--text3);padding:8px 6px 2px;display:flex;flex-direction:column;gap:6px}
.ds-save{display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block}
.dot.ok{background:var(--ok)}
.ds-backup{border:0;background:none;padding:0;font:inherit;font-size:12px;cursor:pointer;text-align:left;color:var(--text3)}
.ds-backup.ok{color:var(--ok)} .ds-backup.warn{color:var(--warn)} .ds-backup.danger{color:var(--danger)}
#content{flex:1;padding:26px 32px;max-width:1100px;min-width:0}
.page-title{font-size:21px;font-weight:800;margin:0 0 16px;letter-spacing:.2px}
.page-sub{color:var(--text2);font-size:13px;margin:-10px 0 16px}
/* ================= 卡片与通用组件 ================= */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.card-title{font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 .card{margin-bottom:0}
.muted{color:var(--text2)} .dim{color:var(--text3)} .small{font-size:12px}
.inline-add{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);
  padding:7px 11px;font:inherit;transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex:0 0 16px;padding:0}
input.num{width:74px} input.num2{width:58px} input.grow{flex:1;min-width:120px}
textarea{width:100%;resize:vertical;min-height:60px}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;
  padding:7px 14px;cursor:pointer;font:inherit;white-space:nowrap;transition:all .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:1px solid transparent;color:#fff;
  box-shadow:0 2px 10px rgba(76,110,245,.30)}
.btn-primary:hover{color:#fff;filter:brightness(1.07)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover{opacity:.9;color:#fff}
.btn-ghost{background:none;border-color:transparent;color:var(--text2)}
.btn-ghost:hover{border-color:var(--border);color:var(--accent)}
.btn-sm{padding:3px 10px;font-size:12px;border-radius:8px}
.list-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:0}
.item-text{flex:1;cursor:pointer;min-width:0;word-break:break-word}
.item-text.done,text.done{text-decoration:line-through;color:var(--text3)}
.del-btn{visibility:hidden;flex:0 0 auto;background:none;border:0;color:var(--text3);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px}
.list-item:hover .del-btn,.hoverable:hover .del-btn{visibility:visible}
.del-btn:hover{color:var(--danger);background:var(--bg)}
.tag-chip{font-size:11px;padding:1px 8px;border-radius:99px;flex:0 0 auto;font-weight:600}
.tag-media{color:var(--tag-media);background:rgba(232,89,12,.12)}
.tag-dev{color:var(--tag-dev);background:rgba(66,99,235,.12)}
.tag-consult{color:var(--tag-consult);background:rgba(12,166,120,.12)}
.tag-life{color:var(--tag-life);background:rgba(156,54,181,.12)}
.chip{display:inline-block;font-size:12px;padding:3px 11px;border-radius:99px;border:1px solid var(--border);
  background:var(--card);color:var(--text2);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:600}
.empty{color:var(--text3);text-align:center;padding:20px 0;font-size:13px}
.progress{height:9px;background:var(--bg2);border-radius:99px;overflow:hidden;margin:8px 0 12px}
.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.statbar{display:flex;gap:18px;color:var(--text2);font-size:13px;margin:0 0 14px;flex-wrap:wrap;align-items:center}
.tabs{display:inline-flex;gap:4px;background:var(--bg2);padding:4px;border-radius:12px;margin-bottom:16px}
.tab{padding:5px 14px;border-radius:9px;border:0;background:transparent;color:var(--text2);cursor:pointer;font:inherit;font-size:13px;transition:all .15s}
.tab.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.group-title{font-size:12px;font-weight:700;color:var(--text3);margin:14px 0 4px;display:flex;align-items:center;gap:8px}
.group-title:first-of-type{margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
/* 左右分栏（自媒体/开发/咨询） */
.split{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.split .card{margin-bottom:0}
/* 看板 */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kcol{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px;min-height:140px}
.kcol-title{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;margin-bottom:8px;font-size:13px;transition:all .15s}
.kcard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.kcard .row{gap:6px}
/* 弹窗与提示 */
.overlay{position:fixed;inset:0;background:rgba(15,18,30,.5);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:50}
.modal{background:var(--card);border-radius:16px;padding:22px;width:440px;max-width:92vw;box-shadow:var(--shadow-lg)}
.modal h3{margin:0 0 10px;font-size:16px}
.modal .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast-area{position:fixed;right:20px;bottom:20px;z-index:60}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;display:flex;gap:14px;
  align-items:center;box-shadow:var(--shadow-lg);font-size:13px}
.toast button{background:none;border:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;opacity:.85}
/* 摘要卡（首页） */
.sum-card{cursor:pointer;transition:all .18s}
.sum-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--accent)}
.sum-card .card-title svg{width:15px;height:15px;color:var(--accent);flex:0 0 15px}
.sum-arrow{margin-left:auto;color:var(--text3);opacity:0;transition:all .15s;font-weight:400}
.sum-card:hover .sum-arrow{opacity:1;color:var(--accent);transform:translateX(2px)}
.sum-line{font-size:13px;color:var(--text2);margin:3px 0;word-break:break-word}
.sum-line b{color:var(--text);font-weight:600}
/* 模板周行 / 历史明细 */
.week-row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.week-row:last-child{border-bottom:0}
.week-day{flex:0 0 52px;font-size:13px;font-weight:600;color:var(--text2)}
.log-detail{background:var(--bg);border-radius:10px;padding:8px 12px;margin:6px 0;font-size:13px}
.lookup-panel{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px;margin-top:8px;max-height:220px;overflow:auto}
.lookup-item{display:flex;justify-content:space-between;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
.lookup-item:hover{background:var(--accent-weak)}
/* 图表（数据看板） */
.chart-row{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.chart-label{flex:0 0 190px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.chart-bar{flex:1;height:15px;background:var(--bg2);border-radius:99px;overflow:hidden}
.chart-bar>i{display:block;height:100%;border-radius:99px;min-width:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}
.chart-val{flex:0 0 66px;font-weight:700;font-variant-numeric:tabular-nums}
/* 月历 */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cal-head-cell{text-align:center;font-size:12px;font-weight:600;color:var(--text3);padding:2px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{min-height:76px;border:1px solid var(--border);border-radius:11px;padding:6px 8px;background:var(--card);font-size:12px;overflow:hidden}
.cal-cell.out{opacity:.35}
.cal-cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal-cell.has{background:var(--accent-weak);border-color:var(--accent)}
.cal-cell[data-action]{cursor:pointer}
.cal-cell[data-action]:hover{border-color:var(--accent);transform:translateY(-1px)}

</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="logo">M</div><div><h1>MyDay</h1><div class="brand-date" id="brand-date"></div></div></div>
    <nav id="nav"></nav>
    <div id="data-status"></div>
  </aside>
  <main id="content"></main>
</div>
<div id="toast-area"></div>
<div id="modal-root"></div>

<script>

         6.各模块视图 7.启动
   ========================================================= */

  settings:{language:'语言',theme:'外观',light:'浅色',dark:'深色',backup:'数据备份',exportBtn:'导出全部数据',

    importSummary:'存档包含：{s}',danger:'危险区',clearTitle:'清空全部数据',

/* ---------- 3. 工具函数 ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const p2 = n => String(n).padStart(2,'0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

let TODAY_OVERRIDE = null;                    // 测试辅助：?today=YYYY-MM-DD 或 App._setToday()
function localDateStr(d){ return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`; }
function todayStr(){ return TODAY_OVERRIDE || localDateStr(new Date()); }
function dateParts(ds){ const [y,m,d] = ds.split('-').map(Number); return {y,m,d}; }
function toDate(ds){ const {y,m,d} = dateParts(ds); return new Date(y, m-1, d); }
function addDaysStr(ds, n){
  const {y,m,d} = dateParts(ds);
  const t = new Date(Date.UTC(y, m-1, d) + n*86400000);
  return `${t.getUTCFullYear()}-${p2(t.getUTCMonth()+1)}-${p2(t.getUTCDate())}`;
}
function diffDays(a, b){                      // b - a（天数）
  const pa = dateParts(a), pb = dateParts(b);
  return Math.round((Date.UTC(pb.y, pb.m-1, pb.d) - Date.UTC(pa.y, pa.m-1, pa.d)) / 86400000);
}
function weekdayKey(ds){ return ['sun','mon','tue','wed','thu','fri','sat'][toDate(ds).getDay()]; }
function mondayOf(ds){ return addDaysStr(ds, -((toDate(ds).getDay()+6)%7)); }
function fmtDateDisp(ds){
  const L = I18N[DB.data.prefs.lang], {m,d} = dateParts(ds), wd = toDate(ds).getDay();
  return DB.data.prefs.lang==='zh' ? `${m}月${d}日 ${L.week[wd]}` : `${L.week[wd]}, ${L.mon[m-1]} ${d}`;
}
function fmtMinutes(min){
  min = Number(min)||0;
  const h = Math.floor(min/60), m = min%60, L = DB.data.prefs.lang;
  if(L==='zh') return h ? (m ? `${h}小时${m}分钟` : `${h}小时`) : `${m}分钟`;
  return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
}
function fmtNum(n){
  n = Number(n)||0;
  const L = DB.data.prefs.lang;
  if(n >= 10000) return (n/10000).toFixed(1).replace(/\.0$/,'') + (L==='zh' ? '万' : 'W');
  if(L!=='zh' && n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'K';
  return String(n);
}
function shiftMonth(ym, n){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, m-1+n, 1);
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}`;
}
function monthGridHtml(ym, cellFn){
  const start = mondayOf(ym+'-01');
  const head = WEEK_KEYS.map(k=>`<div class="cal-head-cell">${t('enum.week.'+k)}</div>`).join('');
  let cells = '';
  for(let i=0;i<42;i++){
    const ds = addDaysStr(start,i);
    const inM = ds.startsWith(ym);
    const c = cellFn(ds, inM) || {};
    cells += `<div class="cal-cell ${inM?'':'out'} ${ds===todayStr()?'today':''} ${c.cls||''}" ${c.attr||''}>${c.html||''}</div>`;
  }
  return `<div class="cal-head">${head}</div><div class="cal-grid">${cells}</div>`;
}
function t(path, vars){
  const get = (dict) => path.split('.').reduce((o,k)=>o?.[k], dict);
  let s = get(I18N[DB.data.prefs.lang]); if(s==null) s = get(I18N.zh);
  if(typeof s !== 'string') return path;
  if(vars) for(const [k,v] of Object.entries(vars)) s = s.replaceAll('{'+k+'}', v);
  return s;
}
const fmtToday = () => fmtDateDisp(todayStr());

/* ---------- 4. 存储 ---------- */
const STORE_KEY = 'myday-data-v1';
function seedData(){
  return {
    schemaVersion: 1,
    prefs: { lang:'zh', theme:'light', lastExportAt:null },
    home:  { memos: [] },
    today: { todos: [] },
    media: { ideas: [], items: [] },
    dev:   { projects: [], tasks: [], notes: [] },
    consult: { clients: [], sessions: [] },
    fitness: { weekTemplate:{mon:'',tue:'',wed:'',thu:'',fri:'',sat:'',sun:''}, logs: [] },
    diet:  { days:{}, waterGoal:8, foodTable: [] },
    games: { games: [], plays: [] }
  };
}
function mergeSeed(d){
  const s = seedData();
  for(const k of Object.keys(s)) if(d[k] === undefined || d[k] === null) d[k] = s[k];
  d.prefs = {...s.prefs, ...(d.prefs||{})};
  d.fitness = {...s.fitness, ...(d.fitness||{})};
  d.fitness.weekTemplate = {...s.fitness.weekTemplate, ...((d.fitness||{}).weekTemplate||{})};
  d.diet = {...s.diet, ...(d.diet||{})};
  return d;
}
const DB = {
  data: null,
  load(){
    let raw = null;
    try{ raw = localStorage.getItem(STORE_KEY); }catch(e){}
    if(raw){
      try{
        const d = JSON.parse(raw);
        if(d && typeof d === 'object' && d.schemaVersion === 1){ this.data = mergeSeed(d); return; }
      }catch(e){}
      try{ localStorage.setItem('myday-data-corrupt-' + Date.now(), raw); }catch(e){}
    }
    this.data = seedData(); this.save();
  },
  save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(this.data)); }catch(e){ alert('保存失败：浏览器存储不可用'); } }
};

function backupStatus(){
  const le = DB.data.prefs.lastExportAt;
  if(!le) return {cls:'danger', label:t('status.never')};
  const d = diffDays(le.slice(0,10), todayStr());
  const label = d<=0 ? t('status.today') : t('status.daysAgo',{n:d});
  if(d < 7)  return {cls:'ok',     label};
  if(d < 30) return {cls:'warn',   label};
  return {cls:'danger', label};
}

/* --- 删除 + 撤销 --- */
let toastTimer = null, undoFn = null;
function toast(msg, onUndo){
  const area = $('#toast-area');
  undoFn = onUndo || null;
  area.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${onUndo?`<button data-action="toast.undo">${t('common.undo')}</button>`:''}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ area.innerHTML=''; undoFn=null; }, 5000);
}
function deleteWithUndo(list, idx, label){
  const [item] = list.splice(idx,1);
  DB.save(); render();
  toast(label, ()=>{ list.splice(idx,0,item); DB.save(); render(); });
}
/* --- 确认弹窗 --- */
function openModal(html){ $('#modal-root').innerHTML = `<div class="overlay" data-overlay="1"><div class="modal">${html}</div></div>`; }
function closeModal(){ $('#modal-root').innerHTML=''; }
function confirmModal({title, body, okLabel, danger=true, onOk, typedWord, typedHint}){
  openModal(`<h3>${esc(title)}</h3><p class="muted">${esc(body)}</p>
    ${typedWord?`<input id="confirm-input" placeholder="${esc(typedHint||typedWord)}" style="width:100%">`:''}
    <div class="modal-actions">
      <button class="btn" data-action="modal.close">${t('common.cancel')}</button>
      <button class="btn ${danger?'btn-danger':'btn-primary'}" data-action="modal.ok">${esc(okLabel||t('common.confirm'))}</button>
    </div>`);
  MODAL_OK = onOk; MODAL_TYPED = typedWord || null;
}
let MODAL_OK = null, MODAL_TYPED = null;

/* --- 事件分发（委托，一次绑定） --- */
const ACTIONS = {};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(el && ACTIONS[el.dataset.action]){ e.preventDefault(); ACTIONS[el.dataset.action](el, e); return; }
  if(e.target.dataset?.overlay !== undefined && e.target === e.target.closest('.overlay')) closeModal();
});
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && String(e.key).toLowerCase()==='s'){
    e.preventDefault(); ACTIONS['app.save'] && ACTIONS['app.save'](); return;
  }
  if(e.isComposing) return;
  const el = e.target.closest('[data-enter],[data-esc]');
  if(!el) return;
  if(e.key==='Enter' && el.dataset.enter){ e.preventDefault(); ACTIONS[el.dataset.enter]?.(el, e); }
  if(e.key==='Escape' && el.dataset.esc){ e.preventDefault(); ACTIONS[el.dataset.esc]?.(el, e); }
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-change]');
  if(el && ACTIONS[el.dataset.change]) ACTIONS[el.dataset.change](el, e);
});
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-input]');
  if(el && ACTIONS[el.dataset.input]) ACTIONS[el.dataset.input](el, e);
});
ACTIONS['nav.go']      = el => go(el.dataset.view);
ACTIONS['app.save']    = () => { DB.save(); renderSidebar(); toast(t('status.saved')); };
ACTIONS['modal.close'] = () => closeModal();
ACTIONS['modal.ok']    = () => {
  if(MODAL_TYPED){
    const v = ($('#confirm-input')||{}).value;
    if(v !== MODAL_TYPED){ toast(t('settings.clearMismatch')); return; }
  }
  const fn = MODAL_OK; MODAL_OK = null; MODAL_TYPED = null; closeModal(); fn && fn();
};
ACTIONS['toast.undo']  = () => {
  const fn = undoFn; undoFn = null; clearTimeout(toastTimer); $('#toast-area').innerHTML='';
  fn && fn();
};

  const reader = new FileReader();
  reader.onload = () => {
    let parsed = null;
    try{ parsed = JSON.parse(reader.result); }catch(err){}
    if(!parsed || typeof parsed !== 'object' || parsed.schemaVersion !== 1 || !parsed.prefs || !parsed.today){
      toast(t('settings.importBad')); return;
    }
    const parts = [
      [t('nav.today'), (parsed.today.todos||[]).length],
      [t('home.memoTitle'), ((parsed.home||{}).memos||[]).length],
      [t('nav.media'), ((parsed.media||{}).items||[]).length],
      [t('nav.dev'), ((parsed.dev||{}).projects||[]).length],

      [t('nav.diet'), Object.keys((parsed.diet||{}).days||{}).length],
      [t('nav.games'), ((parsed.games||{}).games||[]).length]

      body:`${t('settings.importSummary',{s:parts})}\n${t('settings.importBody')}`,
      okLabel:t('settings.importGo'), danger:false,
      onOk:()=>{ DB.data = mergeSeed(parsed); DB.save(); applyPrefs(); render(); toast(t('settings.imported')); } });
  };
  reader.readAsText(f);
});

    <input id="note-title" style="width:100%" placeholder="${t('dev.noteTitlePh')}" value="${esc(n.title||'')}" data-enter="dev.saveNote">
    <textarea id="note-content" placeholder="${t('dev.noteContentPh')}" style="margin-top:6px">${esc(n.content||'')}</textarea>
    <div class="row" style="margin-top:6px;justify-content:flex-end">
      <button class="btn btn-sm" data-action="dev.cancelNote">${t('common.cancel')}</button>
      <button class="btn btn-primary btn-sm" data-action="dev.saveNote">${t('common.save')}</button>
    </div>
  </div>`;
}
function noteItemHtml(n){
  if(ui.noteEdit===n.id) return noteFormHtml(n);
  return `<div class="list-item" style="align-items:flex-start">
    <div style="flex:1;min-width:0">
      <div data-action="dev.editNote" data-id="${n.id}" style="cursor:pointer;font-weight:600;word-break:break-word">${esc(n.title)}</div>
      <div class="small dim" style="white-space:pre-wrap;word-break:break-word">${esc(n.content)}</div>
    </div>
    <button class="del-btn" data-action="dev.delNote" data-id="${n.id}">✕</button>
  </div>`;
}
VIEWS.dev = function(){
  const d = DB.data.dev;
  const q = (ui.devSearch||'').trim().toLowerCase();
  const sel = d.projects.find(p=>p.id===ui.devSel) || d.projects[0];
  let right;
  if(q){
    const notes = d.notes.filter(n=>(n.title+'\n'+n.content).toLowerCase().includes(q));
    right = `<div class="card"><h3 class="card-title">${t('dev.results')} (${notes.length})</h3>
      ${notes.length ? notes.map(n=>{ const p=d.projects.find(x=>x.id===n.projectId);
          return `<div class="list-item">
            <span class="tag-chip tag-dev" style="cursor:default">${esc(p?p.name:'?')}</span>
            <span class="item-text" data-action="dev.openNote" data-id="${n.id}">${esc(n.title)}</span>
          </div>`; }).join('') : emptyHtml(t('dev.noResults'))}
    </div>`;
  } else if(sel){
    const tasks = d.tasks.filter(x=>x.projectId===sel.id);
    const notes = d.notes.filter(x=>x.projectId===sel.id);
    const done = tasks.filter(x=>x.done).length;
    right = `<div class="card">
      <h3 class="card-title">
        ${ui.devRename===sel.id
          ? `<input id="proj-rename" class="grow" value="${esc(sel.name)}" data-enter="dev.renameSave" data-esc="dev.renameCancel">`
          : `<span data-action="dev.renameStart" data-id="${sel.id}" style="cursor:pointer;word-break:break-word">${esc(sel.name)}</span>`}
        <span class="row">
          <select data-change="dev.status" data-id="${sel.id}" class="small">${['active','paused','done'].map(k=>`<option value="${k}" ${sel.status===k?'selected':''}>${t('enum.proj.'+k)}</option>`).join('')}</select>
          <button class="del-btn" style="visibility:visible" data-action="dev.delProject" data-id="${sel.id}">✕</button>
        </span>
      </h3>
      <div class="group-title">${t('dev.tasks')}（${done}/${tasks.length}）</div>
      ${inlineAddHtml({inputId:'devtask-input', placeholder:t('dev.taskPh'), action:'dev.addTask', btnLabel:t('dev.addTaskBtn')})}
      ${tasks.length ? tasks.slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0)).map(devTaskHtml).join('') : emptyHtml(t('dev.noTask'))}
      <div class="group-title" style="margin-top:16px">${t('dev.notes')}</div>
      ${inlineAddHtml({inputId:'note-title-input', placeholder:t('dev.noteTitlePh'), action:'dev.addNoteStart', btnLabel:t('dev.addNote')})}
      ${ui.noteEdit==='new' ? noteFormHtml({title:'',content:''}) : ''}
      ${notes.length ? notes.map(noteItemHtml).join('') : (ui.noteEdit==='new'?'':emptyHtml(t('dev.noNotes')))}
    </div>`;
  } else {
    right = `<div class="card">${emptyHtml(t('dev.noProj'))}</div>`;
  }
  return `<h2 class="page-title">${t('nav.dev')}</h2>
  <div class="card" style="padding:10px 14px;margin-bottom:16px">
    <input id="dev-search" style="width:100%" placeholder="${t('dev.searchPh')}" value="${esc(ui.devSearch||'')}" data-input="dev.search">
  </div>
  <div class="split">
    <div class="card">
      ${inlineAddHtml({inputId:'proj-input', placeholder:t('dev.projPh'), action:'dev.addProject'})}
      ${d.projects.length ? d.projects.map(p=>{
        const ts=d.tasks.filter(x=>x.projectId===p.id), dn=ts.filter(x=>x.done).length;
        return `<div class="list-item" style="cursor:pointer;${sel&&sel.id===p.id?'background:var(--accent-weak);border-radius:8px':''}" data-action="dev.select" data-id="${p.id}">
          <span style="flex:1;min-width:0;word-break:break-word"><b>${esc(p.name)}</b>
          <div class="small dim">${t('enum.proj.'+p.status)} · ${dn}/${ts.length}</div></span>
        </div>`; }).join('') : emptyHtml(t('dev.noProj'))}
    </div>
    ${right}
  </div>`;
};
ACTIONS['dev.search'] = el => { ui.devSearch = el.value; render(); refocus('dev-search'); };
ACTIONS['dev.addProject'] = () => {
  const inp = $('#proj-input'); const v = inp.value.trim();
  if(!v){ refocus('proj-input'); return; }
  const p = { id:uid(), name:v, status:'active', createdAt:todayStr() };
  DB.data.dev.projects.push(p); ui.devSel = p.id; ui.devSearch='';
  DB.save(); render(); refocus('proj-input');
};
ACTIONS['dev.select'] = el => { ui.devSel = el.dataset.id; ui.devSearch=''; ui.noteEdit=null; render(); };
ACTIONS['dev.status'] = el => { const p=DB.data.dev.projects.find(x=>x.id===el.dataset.id); if(p){ p.status=el.value; DB.save(); render(); } };
ACTIONS['dev.renameStart'] = el => { ui.devRename = el.dataset.id; render(); refocus('proj-rename'); };
ACTIONS['dev.renameSave'] = el => {
  const p = DB.data.dev.projects.find(x=>x.id===ui.devRename);
  const v = el.value.trim(); ui.devRename=null;
  if(p && v){ p.name=v; DB.save(); }
  render();
};
ACTIONS['dev.renameCancel'] = () => { ui.devRename=null; render(); };
ACTIONS['dev.delProject'] = el => {
  const id = el.dataset.id, p = DB.data.dev.projects.find(x=>x.id===id);
  if(!p) return;
  confirmModal({ title:t('common.del')+' · '+p.name, body:t('dev.delConfirm'), okLabel:t('common.del'),
    onOk:()=>{ const d=DB.data.dev;
      d.projects = d.projects.filter(x=>x.id!==id);
      d.tasks = d.tasks.filter(x=>x.projectId!==id);
      d.notes = d.notes.filter(x=>x.projectId!==id);
      if(ui.devSel===id) ui.devSel=null;
      DB.save(); render(); } });
};
ACTIONS['dev.addTask'] = () => {
  const sel = DB.data.dev.projects.find(p=>p.id===ui.devSel) || DB.data.dev.projects[0];
  const inp = $('#devtask-input'); const v = inp.value.trim();
  if(!sel || !v){ refocus('devtask-input'); return; }
  DB.data.dev.tasks.push({ id:uid(), projectId:sel.id, text:v, done:false });
  DB.save(); render(); refocus('devtask-input');
};
ACTIONS['dev.toggleTask'] = el => { const x=DB.data.dev.tasks.find(t=>t.id===el.dataset.id); if(x){ x.done=!x.done; DB.save(); render(); } };
ACTIONS['dev.delTask'] = el => {
  const list=DB.data.dev.tasks, idx=list.findIndex(t=>t.id===el.dataset.id);
  if(idx>=0) deleteWithUndo(list, idx, t('common.deleted'));
};
ACTIONS['dev.editTask'] = el => { ui.editTask=el.dataset.id; render(); refocus('devtask-edit'); };
ACTIONS['dev.saveTaskEdit'] = el => {
  const x=DB.data.dev.tasks.find(t=>t.id===ui.editTask);
  const v=el.value.trim(); ui.editTask=null;
  if(x && v){ x.text=v; DB.save(); }
  render();
};
ACTIONS['dev.cancelTaskEdit'] = () => { ui.editTask=null; render(); };
ACTIONS['dev.addNoteStart'] = () => { ui.noteEdit='new'; render(); refocus('note-title'); };
ACTIONS['dev.saveNote'] = () => {
  const title=$('#note-title').value.trim(), content=$('#note-content').value;
  if(!title){ refocus('note-title'); return; }
  const sel=DB.data.dev.projects.find(p=>p.id===ui.devSel)||DB.data.dev.projects[0];
  if(!sel) return;
  if(ui.noteEdit==='new') DB.data.dev.notes.push({ id:uid(), projectId:sel.id, title, content });
  else { const n=DB.data.dev.notes.find(x=>x.id===ui.noteEdit); if(n){ n.title=title; n.content=content; } }
  ui.noteEdit=null; DB.save(); render();
};
ACTIONS['dev.editNote'] = el => { ui.noteEdit=el.dataset.id; render(); refocus('note-title'); };
ACTIONS['dev.cancelNote'] = () => { ui.noteEdit=null; render(); };
ACTIONS['dev.delNote'] = el => {
  const list=DB.data.dev.notes, idx=list.findIndex(x=>x.id===el.dataset.id);
  if(idx>=0) deleteWithUndo(list, idx, t('common.deleted'));
};
ACTIONS['dev.openNote'] = el => {
  const n=DB.data.dev.notes.find(x=>x.id===el.dataset.id);
  if(n){ ui.devSel=n.projectId; ui.devSearch=''; ui.noteEdit=n.id; render(); refocus('note-title'); }
};
/* --- 咨询工作 --- */
function sessionFormHtml(){
  return `<div style="background:var(--accent-weak);border-radius:8px;padding:10px;margin-bottom:10px">
    <div class="row">
      <span class="small dim">${t('consult.sDate')}</span>
      <input id="s-date" type="date" value="${todayStr()}" style="width:150px">
      <span class="small dim">${t('consult.minutes')}</span>
      <input id="s-min" type="number" class="num2" placeholder="${t('common.optional')}">
    </div>
    <textarea id="s-summary" placeholder="${t('consult.summary')}" style="margin-top:6px"></textarea>
    <input id="s-follow" style="width:100%;margin-top:6px" placeholder="${t('consult.followUp')}（${t('common.optional')}）" data-enter="consult.saveSession">
    <div class="row" style="margin-top:8px;justify-content:flex-end">
      <button class="btn btn-sm" data-action="consult.sessionFormClose">${t('common.cancel')}</button>
      <button class="btn btn-primary btn-sm" data-action="consult.saveSession">${t('common.save')}</button>
    </div>
  </div>`;
}
function sessionItemHtml(s){
  return `<div class="list-item" style="align-items:flex-start">
    <div style="flex:1;min-width:0">
      <div class="row small dim">${esc(s.date)}${s.minutes?`<span>· ${s.minutes} ${t('common.min')}</span>`:''}</div>
      <div style="white-space:pre-wrap;word-break:break-word">${esc(s.summary)}</div>
      ${s.followUp?`<div class="row small" style="margin-top:4px">
        <span class="dim">↳ ${esc(s.followUp)}</span>
        ${s.todoAdded
          ? `<span class="tag-chip tag-consult" style="cursor:default">${t('consult.addedFollow')}</span>`
          : `<button class="btn btn-ghost btn-sm" data-action="consult.addFollow" data-id="${s.id}">${t('consult.addFollow')}</button>`}
      </div>`:''}
    </div>
    <button class="del-btn" data-action="consult.delSession" data-id="${s.id}">✕</button>
  </div>`;
}
VIEWS.consult = function(){
  const d = DB.data.consult;
  const q = (ui.consSearch||'').trim().toLowerCase();
  const sel = d.clients.find(c=>c.id===ui.consSel) || d.clients[0];
  const mk = todayStr().slice(0,7);
  const monthN = d.sessions.filter(s=>(s.date||'').startsWith(mk)).length;
  const totalMin = d.sessions.reduce((s,x)=>s+(Number(x.minutes)||0),0);
  const clients = q ? d.clients.filter(c=>(c.name+'\n'+c.note).toLowerCase().includes(q)) : d.clients;
  let right;
  if(sel){
    const sessions = d.sessions.filter(s=>s.clientId===sel.id).slice().sort((a,b)=>b.date<a.date?-1:1);
    const fieldInput = (f, val) => ui.consField && ui.consField.id===sel.id && ui.consField.field===f
      ? `<input id="c-field" class="grow" value="${esc(val||'')}" data-enter="consult.saveField" data-esc="consult.cancelField">`
      : `<span class="item-text" data-action="consult.editField" data-id="${sel.id}" data-field="${f}" style="cursor:pointer">${esc(val||'—')}</span>`;
    right = `<div class="card">
      <h3 class="card-title">
        ${ui.consRename===sel.id
          ? `<input id="client-rename" class="grow" value="${esc(sel.name)}" data-enter="consult.renameSave" data-esc="consult.renameCancel">`
          : `<span data-action="consult.renameStart" data-id="${sel.id}" style="cursor:pointer;word-break:break-word">${esc(sel.name)}</span>`}
        <button class="btn btn-ghost btn-sm" style="color:var(--danger)" data-action="consult.delClient" data-id="${sel.id}">${t('consult.delBtn')}</button>
      </h3>
      <div class="group-title">${t('consult.info')}</div>
      <div class="row small" style="margin-bottom:6px"><span class="dim" style="flex:0 0 66px">${t('consult.noteLabel')}</span>${fieldInput('note', sel.note)}</div>
      <div class="row small"><span class="dim" style="flex:0 0 66px">${t('consult.contact')}</span>${fieldInput('contact', sel.contact)}</div>
      <div class="group-title" style="margin-top:14px">${t('consult.sessions')}</div>
      ${ui.sessionForm ? sessionFormHtml() : `<div class="row" style="margin-bottom:8px"><button class="btn btn-primary btn-sm" data-action="consult.sessionFormOpen">${t('consult.addSession')}</button></div>`}
      ${sessions.length ? sessions.map(sessionItemHtml).join('') : emptyHtml(t('consult.noSessions'))}
    </div>`;
  } else {
    right = `<div class="card">${emptyHtml(t('consult.noClient'))}</div>`;
  }
  return `<h2 class="page-title">${t('nav.consult')}</h2>
  <div class="statbar"><span>${t('consult.statMonth',{n:monthN})}</span><span>${t('consult.statTotal',{h:fmtMinutes(totalMin)})}</span></div>
  <div class="split">
    <div class="card">
      ${inlineAddHtml({inputId:'client-input', placeholder:t('consult.clientPh'), action:'consult.addClient'})}
      <input id="cons-search" style="width:100%;margin-bottom:8px" placeholder="${t('consult.searchPh')}" value="${esc(ui.consSearch||'')}" data-input="consult.search">
      ${clients.length ? clients.map(c=>`
        <div class="list-item" style="cursor:pointer;${sel&&sel.id===c.id?'background:var(--accent-weak);border-radius:8px':''}" data-action="consult.select" data-id="${c.id}">
          <span style="flex:1;min-width:0;word-break:break-word"><b>${esc(c.name)}</b>
          <div class="small dim">${esc(c.note||'')}</div></span>
        </div>`).join('') : emptyHtml(t('consult.noClient'))}
    </div>
    ${right}
  </div>`;
};
ACTIONS['consult.search'] = el => { ui.consSearch = el.value; render(); refocus('cons-search'); };
ACTIONS['consult.addClient'] = () => {
  const inp = $('#client-input'); const v = inp.value.trim();
  if(!v){ refocus('client-input'); return; }
  const c = { id:uid(), name:v, note:'', contact:'' };
  DB.data.consult.clients.push(c); ui.consSel = c.id; ui.consSearch='';
  DB.save(); render(); refocus('client-input');
};
ACTIONS['consult.select'] = el => { ui.consSel = el.dataset.id; ui.consSearch=''; ui.sessionForm=false; ui.consField=null; render(); };
ACTIONS['consult.renameStart'] = el => { ui.consRename = el.dataset.id; render(); refocus('client-rename'); };
ACTIONS['consult.renameSave'] = el => {
  const c = DB.data.consult.clients.find(x=>x.id===ui.consRename);
  const v = el.value.trim(); ui.consRename=null;
  if(c && v){ c.name=v; DB.save(); }
  render();
};
ACTIONS['consult.renameCancel'] = () => { ui.consRename=null; render(); };
ACTIONS['consult.editField'] = el => { ui.consField = { id:el.dataset.id, field:el.dataset.field }; render(); refocus('c-field'); };
ACTIONS['consult.saveField'] = el => {
  const f = ui.consField; const c = f && DB.data.consult.clients.find(x=>x.id===f.id);
  const v = el.value.trim();
  if(c && v){ c[f.field]=v; DB.save(); }
  ui.consField=null; render();
};
ACTIONS['consult.cancelField'] = () => { ui.consField=null; render(); };
ACTIONS['consult.delClient'] = el => {
  const id = el.dataset.id, c = DB.data.consult.clients.find(x=>x.id===id);
  if(!c) return;
  confirmModal({ title:t('common.del')+' · '+c.name, body:t('consult.delConfirm'), okLabel:t('common.del'),
    onOk:()=>{ const d=DB.data.consult;
      d.clients = d.clients.filter(x=>x.id!==id);
      d.sessions = d.sessions.filter(x=>x.clientId!==id);
      if(ui.consSel===id) ui.consSel=null;
      DB.save(); render(); } });
};
ACTIONS['consult.sessionFormOpen']  = () => { ui.sessionForm=true; render(); };
ACTIONS['consult.sessionFormClose'] = () => { ui.sessionForm=false; render(); };
ACTIONS['consult.saveSession'] = () => {
  const sel = DB.data.consult.clients.find(c=>c.id===ui.consSel) || DB.data.consult.clients[0];
  const summary = $('#s-summary').value.trim();
  if(!sel || !summary){ refocus('s-summary'); return; }
  const min = $('#s-min').value;
  DB.data.consult.sessions.push({ id:uid(), clientId:sel.id, date:$('#s-date').value||todayStr(),
    summary, minutes: min?Number(min):null, followUp:$('#s-follow').value.trim(), todoAdded:false });
  ui.sessionForm=false; DB.save(); render();
};
ACTIONS['consult.delSession'] = el => {
  const list=DB.data.consult.sessions, idx=list.findIndex(x=>x.id===el.dataset.id);
  if(idx>=0) deleteWithUndo(list, idx, t('common.deleted'));
};
ACTIONS['consult.addFollow'] = el => {
  const s = DB.data.consult.sessions.find(x=>x.id===el.dataset.id);
  if(!s || s.todoAdded || !s.followUp) return;
  DB.data.today.todos.push({ id:uid(), text:s.followUp, tag:'consult', date:todayStr(), done:false });
  s.todoAdded = true;
  DB.save(); render();
  toast(t('consult.addFollow'));
};
/* --- 健身计划 --- */
const WEEK_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
function fitExLine(e){
  const bits = [String(e.sets||'—'), '×', String(e.reps||'—')];
  if(e.weightKg) bits.push('@ ' + e.weightKg + 'kg');
  return `<div class="list-item">
    <span class="item-text"><b>${esc(e.name)}</b> <span class="dim">${bits.join(' ')}</span>${e.note?` <span class="dim small">${esc(e.note)}</span>`:''}</span>
    <button class="del-btn" data-action="fitness.delEx" data-id="${e.id}">✕</button>
  </div>`;
}
VIEWS.fitness = function(){
  const d = DB.data.fitness;
  const tabs = `<div class="tabs">${[['today','fitness.tabToday'],['template','fitness.tabTemplate'],['history','fitness.tabHistory'],['cal','fitness.tabCal']]
    .map(([k,l])=>`<button class="tab ${ui.fitTab===k?'active':''}" data-action="fitness.tab" data-tab="${k}">${t(l)}</button>`).join('')}</div>`;
  let body;
  if(ui.fitTab==='today'){
    const date = ui.fitDate || todayStr();
    const tpl = d.weekTemplate[weekdayKey(date)];
    const log = d.logs.find(l=>l.date===date);
    body = `<div class="card">
      <h3 class="card-title">${tpl ? t('fitness.planToday',{x:esc(tpl)}) : t('fitness.rest')}
        <span class="row small">
          <input type="date" value="${date}" data-change="fitness.date" class="small">
          ${date!==todayStr()?`<button class="btn btn-ghost btn-sm" data-action="fitness.dateReset">${t('common.today')}</button>`:''}
        </span>
      </h3>
      <div class="inline-add">
        <input id="fx-name" class="grow" placeholder="${t('fitness.exName')}" data-enter="fitness.addEx">
        <input id="fx-sets" type="number" class="num2" placeholder="${t('fitness.sets')}">
        <input id="fx-reps" type="number" class="num2" placeholder="${t('fitness.reps')}">
        <input id="fx-kg" type="number" class="num2" placeholder="${t('fitness.weight')}">
        <button class="btn btn-primary" data-action="fitness.addEx">${t('fitness.addEx')}</button>
      </div>
      <div class="small dim" style="margin:-6px 0 8px">${t('fitness.backdateHint')}</div>
      ${log && log.exercises.length ? log.exercises.map(fitExLine).join('') : emptyHtml(t('fitness.noEx'))}
    </div>`;
  } else if(ui.fitTab==='template'){
    body = `<div class="card">
      ${WEEK_KEYS.map(k=>{
        const v = d.weekTemplate[k];
        return `<div class="week-row">
          <span class="week-day">${t('enum.week.'+k)}</span>
          ${ui.fitTplEdit===k
            ? `<input id="tpl-edit" class="grow" value="${esc(v)}" data-enter="fitness.tplSave" data-esc="fitness.tplCancel">`
            : `<span class="item-text ${v?'':'dim'}" data-action="fitness.tplStart" data-k="${k}" style="cursor:pointer">${v?esc(v):t('fitness.rest')}</span>`}
        </div>`; }).join('')}
    </div>`;
  } else if(ui.fitTab==='cal'){
    const ym = ui.fitCal || todayStr().slice(0,7);
    body = `<div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <button class="btn btn-sm" data-action="fitness.calPrev">‹</button>
        <b>${ym.replace('-',' / ')}</b>
        <span class="row">
          <button class="btn btn-sm" data-action="fitness.calNow">${t('common.today')}</button>
          <button class="btn btn-sm" data-action="fitness.calNext">›</button>
        </span>
      </div>
      ${monthGridHtml(ym, (ds,inM)=>{
        const log = DB.data.fitness.logs.find(l=>l.date===ds);
        const theme = DB.data.fitness.weekTemplate[weekdayKey(ds)];
        if(!inM) return {html:`<span class="dim">${Number(ds.slice(8))}</span>`};
        const html = `<div style="font-weight:700">${Number(ds.slice(8))}</div>` +
          (log ? `<div style="color:var(--accent);font-weight:600">${esc(theme||'·')}</div>
                  <div class="dim">${log.exercises.length} ${t('fitness.exercises')}</div>`
               : (theme?`<div class="dim">${esc(theme)}</div>`:''));
        return {cls: log?'has':'', attr: log?`data-action="fitness.calOpen" data-date="${ds}"`:'',
                html};
      })}
      <div class="small dim" style="margin-top:10px">${t('fitness.backdateHint')}</div>
    </div>`;
  } else {
    const td = todayStr(), mk = td.slice(0,7), wk = mondayOf(td);
    const monthN = d.logs.filter(l=>(l.date||'').startsWith(mk)).length;
    const weekN  = d.logs.filter(l=>l.date>=wk && l.date<=td).length;
    const logs = d.logs.slice().sort((a,b)=>a.date<b.date?1:-1);
    body = `<div class="statbar"><span>${t('fitness.monthStat',{n:monthN})}</span><span>${t('fitness.weekStat',{n:weekN})}</span></div>
    <div class="card">
      ${logs.length ? logs.map(l=>{
        const theme = d.weekTemplate[weekdayKey(l.date)];
        return `<div style="border-bottom:1px solid var(--border);padding:8px 0">
          <div class="row" data-action="fitness.toggleLog" data-id="${l.id}" style="cursor:pointer">
            <b>${esc(fmtDateDisp(l.date))}</b>
            <span class="dim small">${theme?esc(theme):t('fitness.rest')}</span>
            <span class="spacer"></span>
            <span class="dim small">${l.exercises.length} ${t('fitness.exercises')}</span>
            <span class="dim">${ui.fitOpen===l.id?'▾':'▸'}</span>
          </div>
          ${ui.fitOpen===l.id?`<div class="log-detail">${l.exercises.map(fitExLine).join('')}</div>`:''}
        </div>`; }).join('') : emptyHtml(t('fitness.noLogs'))}
    </div>`;
  }
  return `<h2 class="page-title">${t('nav.fitness')}</h2>${tabs}${body}`;
};
ACTIONS['fitness.tab'] = el => { ui.fitTab = el.dataset.tab; render(); };
ACTIONS['fitness.date'] = el => { ui.fitDate = el.value || todayStr(); render(); };
ACTIONS['fitness.dateReset'] = () => { ui.fitDate = null; render(); };
ACTIONS['fitness.addEx'] = () => {
  const name = $('#fx-name').value.trim();
  if(!name){ refocus('fx-name'); return; }
  const date = ui.fitDate || todayStr();
  let log = DB.data.fitness.logs.find(l=>l.date===date);
  if(!log){ log = { id:uid(), date, exercises:[] }; DB.data.fitness.logs.push(log); }
  log.exercises.push({ id:uid(), name,
    sets:$('#fx-sets').value?Number($('#fx-sets').value):null,
    reps:$('#fx-reps').value?Number($('#fx-reps').value):null,
    weightKg:$('#fx-kg').value?Number($('#fx-kg').value):null, note:'' });
  DB.save(); render(); refocus('fx-name');
};
ACTIONS['fitness.delEx'] = el => {
  for(const log of DB.data.fitness.logs){
    const i = log.exercises.findIndex(e=>e.id===el.dataset.id);
    if(i>=0){ log.exercises.splice(i,1); if(!log.exercises.length) DB.data.fitness.logs = DB.data.fitness.logs.filter(l=>l.id!==log.id); DB.save(); render(); return; }
  }
};
ACTIONS['fitness.tplStart'] = el => { ui.fitTplEdit = el.dataset.k; render(); refocus('tpl-edit'); };
ACTIONS['fitness.tplSave'] = el => {
  const k = ui.fitTplEdit;
  if(k){ DB.data.fitness.weekTemplate[k] = el.value.trim(); DB.save(); }
  ui.fitTplEdit = null; render();
};
ACTIONS['fitness.tplCancel'] = () => { ui.fitTplEdit = null; render(); };
ACTIONS['fitness.toggleLog'] = el => { ui.fitOpen = ui.fitOpen===el.dataset.id ? null : el.dataset.id; render(); };
ACTIONS['fitness.calPrev'] = () => { ui.fitCal = shiftMonth(ui.fitCal||todayStr().slice(0,7), -1); render(); };
ACTIONS['fitness.calNext'] = () => { ui.fitCal = shiftMonth(ui.fitCal||todayStr().slice(0,7), 1); render(); };
ACTIONS['fitness.calNow']  = () => { ui.fitCal = todayStr().slice(0,7); render(); };
ACTIONS['fitness.calOpen'] = el => { ui.fitTab='today'; ui.fitDate=el.dataset.date; render(); };
/* --- 饮食计划 --- */
const MEALS = ['breakfast','lunch','dinner','snack'];
function ensureDietDay(ds){
  const days = DB.data.diet.days;
  if(!days[ds]) days[ds] = { meals:{breakfast:[],lunch:[],dinner:[],snack:[]}, water:0 };
  if(!days[ds].meals) days[ds].meals = {breakfast:[],lunch:[],dinner:[],snack:[]};
  return days[ds];
}
function mealCardHtml(key, day){
  const items = day.meals[key];
  const pick = ui.dietPick===key;
  const table = DB.data.diet.foodTable;
  const flt = (ui.dietFilter||'').toLowerCase();
  const cands = table.filter(f=>f.name.toLowerCase().includes(flt));
  return `<div class="card">
    <h3 class="card-title">${t('enum.meal.'+key)}<span class="dim small">${items.reduce((s,f)=>s+(Number(f.kcal)||0),0)||''}</span></h3>
    <div class="inline-add">
      <input id="food-name-${key}" class="grow" placeholder="${t('diet.foodPh')}" data-enter="diet.addFood" data-meal="${key}">
      <input id="food-kcal-${key}" type="number" class="num2" placeholder="${t('diet.kcalPh')}">
      <button class="btn btn-sm" data-action="diet.addFood" data-meal="${key}">${t('common.add')}</button>
      <button class="btn btn-ghost btn-sm" data-action="diet.pickToggle" data-meal="${key}">${t('diet.pickFromLookup')}</button>
    </div>
    ${pick ? `<div class="lookup-panel">
      <input id="lookup-filter" style="width:100%" placeholder="${t('diet.filterPh')}" value="${esc(ui.dietFilter||'')}" data-input="diet.pickFilter">
      ${table.length ? (cands.length ? cands.map(f=>`
        <div class="lookup-item" data-action="diet.pickAdd" data-meal="${key}" data-id="${f.id}">
          <span>${esc(f.name)}</span><span class="dim">${f.kcal||'—'} ${t('common.kcal')}</span>
        </div>`).join('') : `<div class="empty" style="padding:8px">${t('diet.noPick')}</div>`) : `<div class="empty" style="padding:8px">${t('diet.lookupEmpty')}</div>`}
    </div>` : ''}
    ${items.length ? items.map(f=>`<div class="list-item">
        <span class="item-text">${esc(f.name)}${f.kcal?` <span class="dim small">${f.kcal} ${t('common.kcal')}</span>`:''}</span>
        <button class="del-btn" data-action="diet.delFood" data-meal="${key}" data-id="${f.id}">✕</button>
      </div>`).join('') : ''}
  </div>`;
}
VIEWS.diet = function(){
  const ds = ui.dietDate || todayStr();
  const day = ensureDietDay(ds);
  const tabs = `<div class="tabs">${[['today','diet.tabToday'],['lookup','diet.tabLookup'],['cal','diet.tabCal']]
    .map(([k,l])=>`<button class="tab ${ui.dietTab===k?'active':''}" data-action="diet.tab" data-tab="${k}">${t(l)}</button>`).join('')}</div>`;
  const prev = addDaysStr(ds,-1), next = addDaysStr(ds,1), isToday = ds===todayStr();
  const dateNav = `<div class="row" style="margin-bottom:12px">
    <button class="btn btn-sm" data-action="diet.prev">‹</button>
    <span class="muted">${ds===todayStr()?t('common.today'):fmtDateDisp(ds)}</span>
    ${isToday?`<button class="btn btn-sm" disabled style="opacity:.4">›</button>`:`<button class="btn btn-sm" data-action="diet.next">›</button>`}
  </div>`;
  let body;
  if(ui.dietTab==='today'){
    const total = MEALS.reduce((s,k)=>s+day.meals[k].reduce((q,f)=>q+(Number(f.kcal)||0),0),0);
    body = `${dateNav}
    <div class="grid2">${MEALS.map(k=>mealCardHtml(k, day)).join('')}</div>
    <div class="card" style="margin-top:16px">
      <h3 class="card-title">${t('diet.water')}
        ${ui.dietGoalEdit
          ? `<input id="goal-edit" type="number" class="num2" value="${DB.data.diet.waterGoal}" data-enter="diet.goalSave" data-esc="diet.goalCancel">`
          : `<span class="row small"><span class="dim">${t('diet.waterGoal',{n:DB.data.diet.waterGoal})}</span>
             <button class="btn btn-ghost btn-sm" data-action="diet.goalEdit">${t('diet.editGoal')}</button></span>`}
      </h3>
      <div class="row" style="font-size:22px"><b>${day.water}</b><span class="dim">/ ${DB.data.diet.waterGoal}</span>
        <button class="btn" data-action="diet.waterPlus">${t('diet.addCup')}</button>
        <button class="btn" data-action="diet.waterMinus">${t('diet.subCup')}</button>
      </div>
      <div class="small dim" style="margin-top:8px">${total?t('diet.totalKcal',{n:total}):''}</div>
    </div>`;
  } else if(ui.dietTab==='cal'){
    const ym = ui.dietCal || todayStr().slice(0,7);
    body = `<div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <button class="btn btn-sm" data-action="diet.calPrev">‹</button>
        <b>${ym.replace('-',' / ')}</b>
        <span class="row">
          <button class="btn btn-sm" data-action="diet.calNow">${t('common.today')}</button>
          <button class="btn btn-sm" data-action="diet.calNext">›</button>
        </span>
      </div>
      ${monthGridHtml(ym, (ds,inM)=>{
        const day = DB.data.diet.days[ds];
        if(!inM) return {html:`<span class="dim">${Number(ds.slice(8))}</span>`};
        let html = `<div style="font-weight:700">${Number(ds.slice(8))}</div>`;
        if(day){
          const kcal = MEALS.reduce((s,k)=>s+(day.meals[k]||[]).reduce((q,f)=>q+(Number(f.kcal)||0),0),0);
          const n = MEALS.filter(k=>(day.meals[k]||[]).length).length;
          html += (kcal?`<div style="color:var(--accent);font-weight:600">${kcal} ${t('common.kcal')}</div>`:'')
               + (n?`<div class="dim">${t('home.mealsN',{n})}</div>`:'')
               + `<div class="dim">💧 ${day.water||0} / ${DB.data.diet.waterGoal}</div>`;
        }
        return {cls: day?'has':'', attr:`data-action="diet.calOpen" data-date="${ds}"`, html};
      })}
    </div>`;
  } else {
    body = `<div class="card">
      <div class="inline-add">
        <input id="lk-name" class="grow" placeholder="${t('diet.lookupName')}" data-enter="diet.lookupAdd">
        <input id="lk-kcal" type="number" class="num2" placeholder="${t('diet.lookupKcal')}">
        <button class="btn btn-primary" data-action="diet.lookupAdd">${t('diet.addFood')}</button>
      </div>
      ${DB.data.diet.foodTable.length ? DB.data.diet.foodTable.map(f=>`<div class="list-item">
          <span class="item-text">${esc(f.name)}</span>
          <span class="dim small">${f.kcal||'—'} ${t('common.kcal')}</span>
          <button class="del-btn" data-action="diet.lookupDel" data-id="${f.id}">✕</button>
        </div>`).join('') : emptyHtml(t('diet.lookupEmpty'))}
    </div>`;
  }
  return `<h2 class="page-title">${t('nav.diet')}</h2>${tabs}${body}`;
};
ACTIONS['diet.tab'] = el => { ui.dietTab = el.dataset.tab; ui.dietPick=null; render(); };
ACTIONS['diet.prev'] = () => { ui.dietDate = addDaysStr(ui.dietDate||todayStr(),-1); ui.dietPick=null; render(); };
ACTIONS['diet.next'] = () => { const n = addDaysStr(ui.dietDate||todayStr(),1); if(n<=todayStr()){ ui.dietDate=n; ui.dietPick=null; render(); } };
ACTIONS['diet.addFood'] = el => {
  const key = el.dataset.meal || (document.activeElement&&document.activeElement.dataset.meal) || '';
  const name = $(`#food-name-${key}`); const kcal = $(`#food-kcal-${key}`);
  if(!name || !name.value.trim()){ if(name) refocus(`food-name-${key}`); return; }
  ensureDietDay(ui.dietDate||todayStr()).meals[key].push({ id:uid(), name:name.value.trim(), kcal:kcal&&kcal.value?Number(kcal.value):null });
  DB.save(); render(); refocus(`food-name-${key}`);
};
ACTIONS['diet.delFood'] = el => {
  const items = ensureDietDay(ui.dietDate||todayStr()).meals[el.dataset.meal];
  const idx = items.findIndex(f=>f.id===el.dataset.id);
  if(idx>=0) deleteWithUndo(items, idx, t('common.deleted'));
};
ACTIONS['diet.pickToggle'] = el => {
  ui.dietPick = ui.dietPick===el.dataset.meal ? null : el.dataset.meal;
  ui.dietFilter=''; render();
  if(ui.dietPick) refocus('lookup-filter');
};
ACTIONS['diet.pickFilter'] = el => { ui.dietFilter = el.value; render(); refocus('lookup-filter'); };
ACTIONS['diet.pickAdd'] = el => {
  const f = DB.data.diet.foodTable.find(x=>x.id===el.dataset.id);
  if(!f) return;
  ensureDietDay(ui.dietDate||todayStr()).meals[el.dataset.meal].push({ id:uid(), name:f.name, kcal:f.kcal });
  DB.save(); render();
};
ACTIONS['diet.waterPlus']  = () => { const day=ensureDietDay(ui.dietDate||todayStr()); day.water++; DB.save(); render(); };
ACTIONS['diet.waterMinus'] = () => { const day=ensureDietDay(ui.dietDate||todayStr()); if(day.water>0) day.water--; DB.save(); render(); };
ACTIONS['diet.goalEdit'] = () => { ui.dietGoalEdit=true; render(); refocus('goal-edit'); };
ACTIONS['diet.goalSave'] = el => {
  const v = Number(el.value);
  if(v>0) DB.data.diet.waterGoal = v;
  ui.dietGoalEdit=false; DB.save(); render();
};
ACTIONS['diet.goalCancel'] = () => { ui.dietGoalEdit=false; render(); };
ACTIONS['diet.lookupAdd'] = () => {
  const name = $('#lk-name'); const kcal = $('#lk-kcal');
  if(!name.value.trim()){ refocus('lk-name'); return; }
  DB.data.diet.foodTable.push({ id:uid(), name:name.value.trim(), kcal:kcal.value?Number(kcal.value):null });
  DB.save(); render(); refocus('lk-name');
};
ACTIONS['diet.lookupDel'] = el => {
  const list = DB.data.diet.foodTable, idx = list.findIndex(f=>f.id===el.dataset.id);
  if(idx>=0) deleteWithUndo(list, idx, t('common.deleted'));
};
ACTIONS['diet.calPrev'] = () => { ui.dietCal = shiftMonth(ui.dietCal||todayStr().slice(0,7), -1); render(); };
ACTIONS['diet.calNext'] = () => { ui.dietCal = shiftMonth(ui.dietCal||todayStr().slice(0,7), 1); render(); };
ACTIONS['diet.calNow']  = () => { ui.dietCal = todayStr().slice(0,7); render(); };
ACTIONS['diet.calOpen'] = el => { ui.dietDate = el.dataset.date; ui.dietTab = 'today'; ui.dietPick = null; render(); };
/* --- 游戏娱乐 --- */
const GAME_ST = ['playing','wish','finished','dropped'];
VIEWS.games = function(){
  const d = DB.data.games;
  const td = todayStr(), mk = td.slice(0,7);
  const monthMin = d.plays.filter(p=>(p.date||'').startsWith(mk)).reduce((s,p)=>s+(Number(p.minutes)||0),0);
  const playingN = d.games.filter(g=>g.status==='playing').length;
  const chips = [['all','common.all'],...GAME_ST.map(k=>[k,'enum.game.'+k])]
    .map(([k,l])=>`<button class="chip ${ui.gameFilter===k?'active':''}" data-action="games.filter" data-f="${k}">${t(l)}</button>`).join('');
  const list = d.games.filter(g=>ui.gameFilter==='all'||g.status===ui.gameFilter);
  const recent = d.plays.slice().reverse().slice(0,10);
  return `<h2 class="page-title">${t('nav.games')}</h2>
  <div class="statbar"><span>${t('games.monthTotal',{h:fmtMinutes(monthMin)})}</span><span>${t('games.playingN',{n:playingN})}</span></div>
  <div class="card">
    ${inlineAddHtml({inputId:'game-input', placeholder:t('games.gamePh'), action:'games.add'})}
    <div class="row" style="margin-bottom:10px">${chips}</div>
    ${list.length ? list.map(g=>`
      <div class="list-item">
        <span style="flex:1;min-width:0"><b style="word-break:break-word">${esc(g.name)}</b>
          <div class="small dim">${fmtMinutes(g.totalMinutes||0)}</div></span>
        <select data-change="games.status" data-id="${g.id}" class="small">${GAME_ST.map(k=>`<option value="${k}" ${g.status===k?'selected':''}>${t('enum.game.'+k)}</option>`).join('')}</select>
        ${ui.gameLog===g.id
          ? `<input id="play-min" type="number" class="num2" placeholder="${t('games.minPh')}" data-enter="games.logSave" autofocus>
             <button class="btn btn-primary btn-sm" data-action="games.logSave" data-id="${g.id}">${t('games.log')}</button>`
          : `<button class="btn btn-sm" data-action="games.logStart" data-id="${g.id}">${t('games.record')}</button>`}
        <button class="del-btn" data-action="games.del" data-id="${g.id}">✕</button>
      </div>`).join('') : emptyHtml(t('games.noGames'))}
  </div>
  <div class="card">
    <h3 class="card-title">${t('games.recent')}</h3>
    ${recent.length ? recent.map(p=>{
      const g = d.games.find(x=>x.id===p.gameId);
      return `<div class="list-item"><span class="dim small" style="flex:0 0 96px">${esc(p.date)}</span>
        <span class="item-text">${esc(g?g.name:'?')}</span><span class="small">${fmtMinutes(p.minutes)}</span></div>`;
    }).join('') : emptyHtml(t('games.noPlays'))}
  </div>`;
};
ACTIONS['games.add'] = () => {
  const inp = $('#game-input'); const v = inp.value.trim();
  if(!v){ refocus('game-input'); return; }
  DB.data.games.games.push({ id:uid(), name:v, status:'wish', totalMinutes:0 });
  DB.save(); render(); refocus('game-input');
};
ACTIONS['games.filter'] = el => { ui.gameFilter = el.dataset.f; render(); };
ACTIONS['games.status'] = el => { const g=DB.data.games.games.find(x=>x.id===el.dataset.id); if(g){ g.status=el.value; DB.save(); render(); } };
ACTIONS['games.logStart'] = el => { ui.gameLog = el.dataset.id; render(); refocus('play-min'); };
ACTIONS['games.logSave'] = el => {
  const id = el.dataset.id || ui.gameLog;
  const g = DB.data.games.games.find(x=>x.id===id);
  const min = Number(($('#play-min')||{}).value);
  if(!g || !min || min<=0){ refocus('play-min'); return; }
  g.totalMinutes = (g.totalMinutes||0) + min;
  DB.data.games.plays.push({ id:uid(), gameId:g.id, date:todayStr(), minutes:min });
  ui.gameLog = null; DB.save(); render();
};
ACTIONS['games.del'] = el => {
  const id = el.dataset.id;
  const gi = DB.data.games.games.findIndex(g=>g.id===id);
  if(gi<0) return;
  const game = DB.data.games.games[gi];
  const plays = DB.data.games.plays.filter(p=>p.gameId===id);
  DB.data.games.games.splice(gi,1);
  DB.data.games.plays = DB.data.games.plays.filter(p=>p.gameId!==id);
  DB.save(); render();
  toast(t('common.deleted'), ()=>{
    DB.data.games.games.splice(gi,0,game);
    DB.data.games.plays.push(...plays);
    DB.save(); render();
  });
};

/* ---------- 7. 启动 ---------- */
const App = {
  version: '1.1.1',
  get data(){ return DB.data; },
  save: () => DB.save(),
  t, go, render,
  _setToday(v){ TODAY_OVERRIDE = v; render(); },
  _getToday: () => todayStr()
};
window.App = App;

DB.load();
const __q = new URLSearchParams(location.search);
if(__q.get('today')) TODAY_OVERRIDE = __q.get('today');
applyPrefs();
render();
</script>
</body>
